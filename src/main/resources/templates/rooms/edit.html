<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa phòng - Hệ thống Quản lý Phòng Trọ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 antialiased min-h-screen">

<div th:replace="~{fragments/header :: header}"></div>

<div class="flex min-h-[calc(100vh-64px)]">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="flex-1 p-6 md:p-8 bg-slate-50 flex flex-col items-center justify-center">

        <div class="w-full max-w-2xl">

            <div class="mb-6">
                <div class="flex items-center gap-2 text-xs text-slate-400 font-medium uppercase tracking-wider mb-1.5">
                    <a th:href="@{/rooms}" class="hover:text-blue-600 transition-colors">Quản lý phòng</a>
                    <span>/</span>
                    <span class="text-slate-500">Chỉnh sửa phòng</span>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Cập nhật thông tin phòng</h2>
                <p class="text-sm text-slate-500 mt-1">Chỉnh sửa các thông số của phòng. Hệ thống sẽ cập nhật thay đổi
                    ngay lập tức.</p>
            </div>

            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">

                <form th:action="@{/rooms/edit/{id}(id=${room.id})}" th:object="${room}" method="post"
                      class="space-y-5">

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Mã phòng <span
                                    class="text-rose-500">*</span></label>
                            <input type="text"
                                   th:field="*{roomCode}"
                                   placeholder="Mã phòng (ví dụ: P101)"
                                   required
                                   class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Tên phòng <span
                                    class="text-rose-500">*</span></label>
                            <input type="text"
                                   th:field="*{roomName}"
                                   placeholder="Tên phòng"
                                   required
                                   class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Giá thuê (VND/tháng) <span
                                    class="text-rose-500">*</span></label>
                            <input type="number"
                                   th:field="*{price}"
                                   placeholder="Giá thuê"
                                   required
                                   min="0"
                                   class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Diện tích (m²) <span
                                    class="text-rose-500">*</span></label>
                            <input type="number"
                                   step="0.01"
                                   th:field="*{area}"
                                   placeholder="Diện tích"
                                   required
                                   min="0"
                                   class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Số người tối đa <span
                                    class="text-rose-500">*</span></label>
                            <input type="number"
                                   th:field="*{maxPeople}"
                                   placeholder="Số người tối đa"
                                   required
                                   min="1"
                                   class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Trạng thái phòng</label>
                            <select th:field="*{status}"
                                    class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150 cursor-pointer">
                                <option value="AVAILABLE">Còn trống (AVAILABLE)</option>
                                <option value="RENTED">Đã thuê (RENTED)</option>
                                <option value="MAINTENANCE">Bảo trì (MAINTENANCE)</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                        <a th:href="@{/rooms}"
                           class="px-5 py-2.5 text-sm font-semibold text-slate-600 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 rounded-xl transition duration-150 text-center">
                            Hủy thay đổi
                        </a>

                        <button type="submit"
                                class="px-6 py-2.5 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-sm shadow-blue-500/10 transition duration-150 cursor-pointer">
                            Cập nhật
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </main>
</div>

</body>
</html>
