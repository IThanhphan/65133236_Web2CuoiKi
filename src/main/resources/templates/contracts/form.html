<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo Hợp Đồng Mới</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="flex-1 p-8 overflow-y-auto">
    <div class="max-w-2xl mx-auto">

        <div class="mb-4">
            <a th:href="@{/contracts}" class="text-xs font-medium text-slate-500 hover:text-blue-600">← Quay lại danh
                sách</a>
        </div>

        <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Thiết Lập Hợp Đồng Thuê Nhà</h1>
            <p class="text-sm text-slate-500">Vui lòng chọn phòng, người thuê và điền các mốc thời gian pháp lý[cite:
                61, 62, 63, 64].</p>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-xs p-6">
            <form th:action="@{/contracts/save}" th:object="${contract}" method="post" class="space-y-5">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Mã Hợp Đồng <span
                            class="text-red-500">*</span></label>
                    <input type="text" th:field="*{contractCode}" required
                           class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm bg-slate-50 font-mono font-bold text-slate-700 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Chọn Phòng Trọ <span
                                class="text-red-500">*</span></label>
                        <select th:field="*{room}" required
                                class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 bg-white">
                            <option value="" th:text="'-- Chọn phòng trống --'"></option>
                            <option th:each="r : ${rooms}" th:value="${r.id}"
                                    th:text="${r.roomName} + ' (' + ${r.status} + ')'"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Chọn Người Thuê <span
                                class="text-red-500">*</span></label>
                        <select th:field="*{tenant}" required
                                class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 bg-white">
                            <option value="" th:text="'-- Chọn khách thuê --'"></option>
                            <option th:each="t : ${tenants}" th:value="${t.id}"
                                    th:text="${t.fullName} + ' - ' + ${t.citizenId}"></option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Ngày Bắt Đầu Thuê
                            <span class="text-red-500">*</span></label>
                        <input type="date" th:field="*{startDate}" required
                               class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm text-slate-800">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Ngày Kết Thúc (Hết
                            hạn) <span class="text-red-500">*</span></label>
                        <input type="date" th:field="*{endDate}" required
                               class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm text-slate-800">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Giá Thuê Hàng Tháng
                            (VNĐ) <span class="text-red-500">*</span></label>
                        <input type="number" th:field="*{monthlyRent}" required placeholder="Ví dụ: 2500000"
                               class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm text-slate-800">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Tiền Đặt Cọc
                            (VNĐ)</label>
                        <input type="number" th:field="*{depositAmount}" placeholder="Ví dụ: 2500000"
                               class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm text-slate-800">
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100 flex justify-end gap-3">
                    <a th:href="@{/contracts}"
                       class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Hủy
                        bỏ</a>
                    <button type="submit"
                            class="px-5 py-2 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 transition shadow-sm">
                        Kích hoạt & Lưu
                    </button>
                </div>
            </form>
        </div>

    </div>
</main>
</body>
</html>
