<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiết lập hợp đồng - Hệ thống Quản lý Phòng Trọ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 antialiased min-h-screen">

<div th:replace="~{fragments/header :: header}"></div>

<div class="flex min-h-[calc(100vh-64px)]">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="flex-1 p-6 md:p-8 bg-slate-50">
        <div class="max-w-2xl mx-auto">

            <div class="mb-4">
                <a th:href="@{/contracts}"
                   class="inline-flex items-center text-xs font-semibold text-slate-500 hover:text-blue-600 transition-colors">
                    <svg class="w-3.5 h-3.5 me-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                         xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Quay lại danh sách hợp đồng
                </a>
            </div>

            <div class="mb-6">
                <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Thiết lập hợp đồng thuê</h2>
                <p class="text-sm text-slate-500 mt-1">Vui lòng chọn phòng, người thuê và điền đầy đủ thông tin pháp lý
                    bắt buộc.</p>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 md:p-8">
                <form th:action="@{/contracts/save}" th:object="${contract}" method="post" class="space-y-5">

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                            Mã Hợp Đồng <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" th:field="*{contractCode}" required
                               class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 font-mono font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                                Chọn Phòng Trọ <span class="text-rose-500">*</span>
                            </label>
                            <select th:field="*{room}" required
                                    class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150 cursor-pointer">
                                <option value="">-- Chọn phòng trống --</option>
                                <option th:each="r : ${rooms}" th:value="${r.id}"
                                        th:text="${r.roomName} + ' (' + ${r.status} + ')'"></option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                                Chọn Người Thuê <span class="text-rose-500">*</span>
                            </label>
                            <select th:field="*{tenant}" required
                                    class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150 cursor-pointer">
                                <option value="">-- Chọn khách thuê --</option>
                                <option th:each="t : ${tenants}" th:value="${t.id}"
                                        th:text="${t.fullName} + ' - ' + ${t.citizenId}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                                Ngày Bắt Đầu Thuê <span class="text-rose-500">*</span>
                            </label>
                            <input type="date" th:field="*{startDate}" required
                                   class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                                Ngày Kết Thúc (Hết hạn) <span class="text-rose-500">*</span>
                            </label>
                            <input type="date" th:field="*{endDate}" required
                                   class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                                Giá Thuê Hàng Tháng (VNĐ) <span class="text-rose-500">*</span>
                            </label>
                            <input type="number" th:field="*{monthlyRent}" required placeholder="Ví dụ: 2500000"
                                   class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                                Tiền Đặt Cọc (VNĐ)
                            </label>
                            <input type="number" th:field="*{depositAmount}" placeholder="Ví dụ: 2500000"
                                   class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                        </div>
                    </div>

                    <div class="pt-5 border-t border-slate-100 flex items-center justify-end gap-3">
                        <a th:href="@{/contracts}"
                           class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition duration-150">
                            Hủy bỏ
                        </a>
                        <button type="submit"
                                class="inline-flex items-center justify-center px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition duration-150 cursor-pointer shadow-sm shadow-blue-500/10">
                            Kích hoạt & Lưu hợp đồng
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </main>
</div>

</body>
</html>
