<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

<div th:fragment="sidebar"
     class="w-64 bg-slate-900 text-slate-300 flex flex-col min-h-full border-r border-slate-800 shrink-0">

    <nav class="flex-1 px-4 py-6 space-y-1.5">
        <ul id="sidebar-menu">
            <li class="mb-1">
                <a th:href="@{/dashboard}"
                   class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition duration-150 group hover:bg-slate-800 hover:text-white">
                    <svg class="w-5 h-5 opacity-75 group-hover:opacity-100" fill="none" stroke="currentColor"
                         stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/xl">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"></path>
                    </svg>
                    <span>Dashboard</span>
                </a>
            </li>

            <li class="mb-1">
                <a th:href="@{/rooms}"
                   class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition duration-150 group hover:bg-slate-800 hover:text-white">
                    <svg class="w-5 h-5 opacity-75 group-hover:opacity-100" fill="none" stroke="currentColor"
                         stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                    </svg>
                    <span>Quản lý phòng</span>
                </a>
            </li>

            <li class="mb-1">
                <a th:href="@{/tenants}"
                   class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition duration-150 group hover:bg-slate-800 hover:text-white">
                    <svg class="w-5 h-5 opacity-75 group-hover:opacity-100" fill="none" stroke="currentColor"
                         stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                    <span>Người thuê</span>
                </a>
            </li>

            <li class="mb-1">
                <a th:href="@{/contracts}"
                   class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition duration-150 group hover:bg-slate-800 hover:text-white">
                    <svg class="w-5 h-5 opacity-75 group-hover:opacity-100" fill="none" stroke="currentColor"
                         stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <span>Hợp đồng</span>
                </a>
            </li>

            <li class="mb-1">
                <a th:href="@{/invoices}"
                   class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition duration-150 group hover:bg-slate-800 hover:text-white">
                    <svg class="w-5 h-5 opacity-75 group-hover:opacity-100" fill="none" stroke="currentColor"
                         stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                    </svg>
                    <span>Hóa đơn</span>
                </a>
            </li>

            <li class="mb-1">
                <a th:href="@{/payments}"
                   class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition duration-150 group hover:bg-slate-800 hover:text-white">
                    <svg class="w-5 h-5 opacity-75 group-hover:opacity-100" fill="none" stroke="currentColor"
                         stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
                    </svg>
                    <span>Thanh toán</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="p-4 border-t border-slate-800 text-center text-xs text-slate-500">
        <p>Hệ thống Quản lý v1.0</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const currentPath = window.location.pathname; // Lấy URL thực tế trên trình duyệt (ví dụ: /rooms hoặc /rooms/create)
            const navItems = document.querySelectorAll("#sidebar-menu .nav-item");

            navItems.forEach(item => {
                const href = item.getAttribute("href");

                // Kiểm tra nếu đường dẫn hiện tại bắt đầu bằng giá trị href của tab
                if (currentPath.startsWith(href)) {
                    // Loại bỏ các class hover ban đầu để không bị xung đột màu
                    item.classList.remove("hover:bg-slate-800", "hover:text-white");
                    // Thêm màu nền xanh "sáng đèn" cho tab đang chọn
                    item.classList.add("bg-blue-600", "text-white", "font-semibold");
                }
            });
        });
    </script>

</div>

</body>
</html>
