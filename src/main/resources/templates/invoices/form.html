<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lập hóa đơn mới - Hệ thống Quản lý Phòng Trọ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 antialiased min-h-screen">

<div th:replace="~{fragments/header :: header}"></div>

<div class="flex min-h-[calc(100vh-64px)]">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="flex-1 p-6 md:p-8 bg-slate-50">
        <div class="max-w-2xl mx-auto">

            <div class="mb-4">
                <a th:href="@{/invoices}"
                   class="inline-flex items-center text-xs font-semibold text-slate-500 hover:text-blue-600 transition-colors">
                    <svg class="w-3.5 h-3.5 me-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                         xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Quay lại danh sách hóa đơn
                </a>
            </div>

            <div class="mb-6">
                <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Tính toán lập hóa đơn mới</h2>
                <p class="text-sm text-slate-500 mt-1">Chọn hợp đồng thuê phòng đang hoạt động và nhập các chỉ số tiêu
                    thụ.</p>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 md:p-8">
                <form th:action="@{/invoices/save}" th:object="${invoice}" method="post" class="space-y-5">

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                            Mã số Hóa Đơn <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" th:field="*{invoiceCode}" required placeholder="Ví dụ: INV202606P101"
                               class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 font-mono font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                            Áp dụng cho Hợp Đồng (Phòng đang thuê) <span class="text-rose-500">*</span>
                        </label>
                        <select th:field="*{contract}" required id="contract-select"
                                class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150 cursor-pointer">
                            <option value="">-- Chọn hợp đồng đang hoạt động --</option>
                            <option th:each="c : ${contracts}" th:value="${c.id}"
                                    th:data-rent="${c.monthlyRent}"
                                    th:text="${c.contractCode} + ' - ' + ${c.room.roomName} + ' (' + ${c.tenant.fullName} + ')'"></option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Tháng
                                thu tiền <span class="text-rose-500">*</span></label>
                            <select th:field="*{billingMonth}" required
                                    class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition duration-150">
                                <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}"
                                        th:text="'Tháng ' + ${m}"></option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Năm
                                <span class="text-rose-500">*</span></label>
                            <input type="number" th:field="*{billingYear}" required
                                   class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition duration-150">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Tiền
                                Phòng (VNĐ) <span class="text-rose-500">*</span></label>
                            <input type="number" th:field="*{roomFee}" required id="room-fee-input"
                                   class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Tiền
                                Điện tiêu thụ (VNĐ) <span class="text-rose-500">*</span></label>
                            <input type="number" th:field="*{electricityFee}" required
                                   placeholder="Nhập tiền điện sử dụng"
                                   class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition duration-150">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Tiền
                                Nước (VNĐ) <span class="text-rose-500">*</span></label>
                            <input type="number" th:field="*{waterFee}" required placeholder="Nhập tiền nước sử dụng"
                                   class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition duration-150">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Mạng
                                Internet (VNĐ)</label>
                            <input type="number" th:field="*{internetFee}" placeholder="Mặc định: 100,000 đ"
                                   class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition duration-150">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Phí
                                dịch vụ khác (VNĐ)</label>
                            <input type="number" th:field="*{serviceFee}" placeholder="Vệ sinh, rác..."
                                   class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition duration-150">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Hạn
                                đóng tiền cuối cùng <span class="text-rose-500">*</span></label>
                            <input type="date" th:field="*{dueDate}" required
                                   class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition duration-150">
                        </div>
                    </div>

                    <div class="pt-5 border-t border-slate-100 flex items-center justify-end gap-3">
                        <a th:href="@{/invoices}"
                           class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition duration-150">
                            Hủy bỏ
                        </a>
                        <button type="submit"
                                class="inline-flex items-center justify-center px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition duration-150 cursor-pointer shadow-sm shadow-blue-500/10">
                            Lưu & Tính tổng tiền
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const contractSelect = document.getElementById("contract-select");
        const roomFeeInput = document.getElementById("room-fee-input");

        contractSelect.addEventListener("change", function () {
            const selectedOption = contractSelect.options[contractSelect.selectedIndex];
            const baseRent = selectedOption.getAttribute("data-rent");

            if (baseRent) {
                roomFeeInput.value = baseRent;
            } else {
                roomFeeInput.value = "";
            }
        });
    });
</script>

</body>
</html>
