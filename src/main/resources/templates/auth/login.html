<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f4f6f9;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
        }

        .login-box{
            width:400px;
            background:white;

            padding:30px;

            border-radius:10px;

            box-shadow:0 0 20px rgba(0,0,0,.1);
        }

        .login-box h2{
            text-align:center;
        }

        .input-group{
            margin-bottom:15px;
        }

        .input-group label{
            display:block;
            margin-bottom:5px;
        }

        .input-group input{
            width:100%;
            padding:10px;
            box-sizing:border-box;
        }

        .btn{
            width:100%;
            padding:12px;

            background:#0d6efd;
            color:white;

            border:none;
            cursor:pointer;
        }

        .error{
            color:red;
            text-align:center;
        }

        .success{
            color:green;
            text-align:center;
        }

    </style>

</head>
<body>

<div class="login-box">

    <h2>HỆ THỐNG QUẢN LÝ PHÒNG TRỌ</h2>

    <form th:action="@{/login}" method="post">

        <div class="input-group">
            <label>Tài khoản</label>
            <input type="text" name="username">
        </div>

        <div class="input-group">
            <label>Mật khẩu</label>
            <input type="password" name="password">
        </div>

        <button class="btn" type="submit">
            Đăng nhập
        </button>

    </form>

    <p class="error" th:if="${param.error}">
        Sai tài khoản hoặc mật khẩu
    </p>

    <p class="success" th:if="${param.logout}">
        Đăng xuất thành công
    </p>

</div>

</body>
</html>
