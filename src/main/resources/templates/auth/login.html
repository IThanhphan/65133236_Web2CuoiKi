<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Quản lý Phòng Trọ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen antialiased">

<div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-100 mx-4">

    <div class="text-center mb-8">
        <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight uppercase">
            Hệ thống Quản lý Phòng Trọ
        </h2>
        <p class="text-sm text-slate-500 mt-1">Vui lòng đăng nhập tài khoản ADMIN</p>
    </div>

    <form th:action="@{/login}" method="post" class="space-y-5">

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Tài khoản</label>
            <input type="text"
                   name="username"
                   placeholder="Nhập tên đăng nhập..."
                   required
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-200">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Mật khẩu</label>
            <input type="password"
                   name="password"
                   placeholder="••••••••"
                   required
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-200">
        </div>

        <button type="submit"
                class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md shadow-blue-500/20 active:scale-[0.98] transition-all duration-150 cursor-pointer text-center block">
            Đăng nhập
        </button>

    </form>

    <div class="mt-6 space-y-3">
        <div th:if="${param.error}"
             class="flex items-center p-4 text-sm text-red-800 border border-red-200 rounded-xl bg-red-50" role="alert">
            <svg class="shrink-0 inline w-4 height-4 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                 fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
            </svg>
            <span class="font-medium">Sai tài khoản hoặc mật khẩu!</span>
        </div>

        <div th:if="${param.logout}"
             class="flex items-center p-4 text-sm text-green-800 border border-green-200 rounded-xl bg-green-50"
             role="alert">
            <svg class="shrink-0 inline w-4 height-4 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                 fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>
            </svg>
            <span class="font-medium">Đăng xuất thành công!</span>
        </div>
    </div>

</div>

</body>
</html>
