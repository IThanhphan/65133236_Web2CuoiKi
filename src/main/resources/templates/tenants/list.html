<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người thuê - Hệ thống Quản lý Phòng Trọ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 antialiased min-h-screen">

<div th:replace="~{fragments/header :: header}"></div>

<div class="flex min-h-[calc(100vh-64px)]">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="flex-1 p-6 md:p-8 bg-slate-50">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
            <div>
                <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Quản lý người thuê</h2>
                <p class="text-sm text-slate-500 mt-1">Tìm kiếm, thêm, sửa hoặc xóa thông tin khách thuê trọ.</p>
            </div>

            <a th:href="@{/tenants/create}"
               class="inline-flex items-center justify-center px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-sm transition duration-150 cursor-pointer text-sm">
                <svg class="w-4 h-4 me-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                     xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Thêm người thuê mới
            </a>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6">
            <form th:action="@{/tenants}" method="get" class="flex flex-col sm:flex-row items-center gap-3">
                <div class="w-full sm:w-80">
                    <input type="text"
                           name="keyword"
                           placeholder="Tìm theo họ tên hoặc số CCCD..."
                           th:value="${keyword}"
                           class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                </div>
                <button type="submit"
                        class="w-full sm:w-auto px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl text-sm transition duration-150 cursor-pointer shadow-sm shadow-blue-500/10">
                    Tìm kiếm
                </button>
            </form>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="bg-slate-50 border-b border-slate-100 text-slate-600 text-xs uppercase tracking-wider font-semibold">
                        <th class="p-4 text-center">ID</th>
                        <th class="p-4">Họ và Tên</th>
                        <th class="p-4">Số CCCD</th>
                        <th class="p-4 text-center">Số điện thoại</th>
                        <th class="p-4">Email</th>
                        <th class="p-4">Địa chỉ quê quán</th>
                        <th class="p-4 text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm text-slate-700">
                    <tr th:if="${#lists.isEmpty(tenants)}">
                        <td colspan="7" class="p-8 text-center text-slate-400 italic bg-slate-50/50">
                            Không tìm thấy người thuê nào phù hợp.
                        </td>
                    </tr>
                    <tr th:each="tenant : ${tenants}" class="hover:bg-slate-50/70 transition-colors duration-150">
                        <td class="p-4 text-center font-medium text-slate-500" th:text="${tenant.id}"></td>
                        <td class="p-4 font-semibold text-slate-900" th:text="${tenant.fullName}"></td>
                        <td class="p-4 font-mono text-slate-600" th:text="${tenant.citizenId}"></td>
                        <td class="p-4 text-center" th:text="${tenant.phone}"></td>
                        <td class="p-4 text-slate-500" th:text="${tenant.email}"></td>
                        <td class="p-4 text-slate-500" th:text="${tenant.address}"></td>
                        <td class="p-4">
                            <div class="flex items-center justify-center gap-2">
                                <a th:href="@{/tenants/edit/{id}(id=${tenant.id})}"
                                   class="inline-flex items-center px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 font-medium rounded-lg text-xs transition duration-150">
                                    Sửa
                                </a>
                                <a th:href="@{/tenants/delete/{id}(id=${tenant.id})}"
                                   onclick="return confirm('Bạn có chắc muốn xóa người thuê này?')"
                                   class="inline-flex items-center px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium rounded-lg text-xs transition duration-150 cursor-pointer">
                                    Xóa
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="flex justify-center mt-6" th:if="${totalPages > 1}">
            <nav class="inline-flex -space-x-px rounded-xl shadow-xs bg-white border border-slate-200 p-1 gap-1"
                 aria-label="Pagination">
                <a th:if="${currentPage > 0}"
                   th:href="@{/tenants(page=${currentPage - 1}, keyword=${keyword})}"
                   class="inline-flex items-center justify-center w-9 h-9 text-sm font-medium text-slate-500 hover:bg-slate-50 rounded-lg transition duration-150">
                    &laquo;
                </a>

                <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
                    <a th:href="@{/tenants(page=${i - 1}, keyword=${keyword})}"
                       th:text="${i}"
                       th:classappend="${i - 1 == currentPage} ? 'bg-blue-600 text-white font-semibold shadow-xs hover:bg-blue-700' : 'text-slate-600 hover:bg-slate-50'"
                       class="inline-flex items-center justify-center w-9 h-9 text-sm font-medium rounded-lg transition duration-150">
                    </a>
                </th:block>

                <a th:if="${currentPage + 1 < totalPages}"
                   th:href="@{/tenants(page=${currentPage + 1}, keyword=${keyword})}"
                   class="inline-flex items-center justify-center w-9 h-9 text-sm font-medium text-slate-500 hover:bg-slate-50 rounded-lg transition duration-150">
                    &raquo;
                </a>
            </nav>
        </div>

    </main>
</div>
</body>
</html>
