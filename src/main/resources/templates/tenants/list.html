<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Người Thuê</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="flex-1 p-8 overflow-y-auto">
    <div class="max-w-6xl mx-auto">

        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Quản Lý Người Thuê</h1>
                <p class="text-sm text-slate-500">Xem, tìm kiếm và quản lý thông tin khách thuê trọ.</p>
            </div>
            <a th:href="@{/tenants/create}"
               class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition duration-150 shadow-sm flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
                Thêm người thuê
            </a>
        </div>

        <div class="bg-white p-4 rounded-xl border border-slate-200 mb-6 shadow-xs">
            <form th:action="@{/tenants}" method="get" class="flex gap-3">
                <div class="relative flex-1">
                    <input type="text" name="keyword" th:value="${keyword}"
                           placeholder="Tìm theo họ tên hoặc số CCCD..."
                           class="w-full pl-4 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 text-slate-700">
                </div>
                <button type="submit"
                        class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
                    Tìm kiếm
                </button>
                <a th:href="@{/tenants}"
                   class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center">
                    Xóa bộ lọc
                </a>
            </form>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-50 text-slate-600 uppercase text-xs font-semibold border-b border-slate-200">
                    <th class="px-6 py-4">Họ và Tên</th>
                    <th class="px-6 py-4">Số CCCD</th>
                    <th class="px-6 py-4">Số điện thoại</th>
                    <th class="px-6 py-4">Email</th>
                    <th class="px-6 py-4">Địa chỉ quê quán</th>
                    <th class="px-6 py-4 text-right">Hành động</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm text-slate-700">
                <tr th:each="tenant : ${tenants}" class="hover:bg-slate-50/70 transition">
                    <td class="px-6 py-4 font-medium text-slate-900" th:text="${tenant.fullName}"></td>
                    <td class="px-6 py-4 font-mono text-slate-600" th:text="${tenant.citizenId}"></td>
                    <td class="px-6 py-4" th:text="${tenant.phone}"></td>
                    <td class="px-6 py-4 text-slate-500" th:text="${tenant.email}"></td>
                    <td class="px-6 py-4 text-slate-500" th:text="${tenant.address}"></td>
                    <td class="px-6 py-4 text-right space-x-2">
                        <a th:href="@{/tenants/edit/{id}(id=${tenant.id})}"
                           class="text-blue-600 hover:text-blue-800 font-medium text-xs">Sửa</a>
                        <a th:href="@{/tenants/delete/{id}(id=${tenant.id})}"
                           onclick="return confirm('Bạn chắc chắn có muốn xóa người thuê này không?')"
                           class="text-red-500 hover:text-red-700 font-medium text-xs">Xóa</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tenants)}">
                    <td colspan="6" class="px-6 py-10 text-center text-slate-400">Không tìm thấy dữ liệu người thuê phù
                        hợp.
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="bg-white px-6 py-4 flex items-center justify-between border-t border-slate-200"
                 th:if="${totalPages > 0}">
                <div class="text-sm text-slate-500">
                    Hiển thị trang <span class="font-semibold text-slate-800" th:text="${currentPage + 1}">1</span>
                    trên tổng số <span class="font-semibold text-slate-800" th:text="${totalPages}">1</span> trang
                    (<span class="text-slate-600" th:text="${totalItems}">0</span> người thuê)
                </div>

                <div class="inline-flex space-x-1">
                    <a th:href="@{/tenants(keyword=${keyword}, page=${currentPage - 1}, size=${size})}"
                       th:classappend="${currentPage == 0} ? 'pointer-events-none opacity-40' : ''"
                       class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm font-medium text-slate-600 hover:bg-slate-50 transition">
                        Trước
                    </a>

                    <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                        <a th:href="@{/tenants(keyword=${keyword}, page=${i}, size=${size})}"
                           th:text="${i + 1}"
                           th:classappend="${currentPage == i} ? 'bg-blue-600 text-white border-blue-600' : 'text-slate-600 border-slate-300 hover:bg-slate-50'"
                           class="px-3.5 py-1.5 rounded-lg border text-sm font-medium transition inline-block">
                            1
                        </a>
                    </span>

                    <a th:href="@{/tenants(keyword=${keyword}, page=${currentPage + 1}, size=${size})}"
                       th:classappend="${currentPage + 1 == totalPages} ? 'pointer-events-none opacity-40' : ''"
                       class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm font-medium text-slate-600 hover:bg-slate-50 transition">
                        Sau
                    </a>
                </div>
            </div>
        </div>

    </div>
</main>
</body>
</html>
