<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${tenant.id == null} ? 'Thêm Người Thuê' : 'Cập nhật Người Thuê'"></title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="flex-1 p-8 overflow-y-auto">
    <div class="max-w-2xl mx-auto">

        <div class="mb-4">
            <a th:href="@{/tenants}"
               class="text-xs font-medium text-slate-500 hover:text-blue-600 flex items-center gap-1">
                ← Quay lại danh sách
            </a>
        </div>

        <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-800"
                th:text="${tenant.id == null} ? 'Thêm Người Thuê Mới' : 'Cập Nhật Thông Tin'"></h1>
            <p class="text-sm text-slate-500">Vui lòng điền đầy đủ các trường thông tin bắt buộc dưới đây.</p>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-xs p-6">
            <form th:action="@{/tenants/save}" th:object="${tenant}" method="post" class="space-y-5">

                <input type="hidden" th:field="*{id}">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Họ và Tên <span
                            class="text-red-500">*</span></label>
                    <input type="text" th:field="*{fullName}" required placeholder="Ví dụ: Nguyễn Văn A"
                           class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 text-slate-800">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Số CCCD / CMND <span
                                class="text-red-500">*</span></label>
                        <input type="text" th:field="*{citizenId}" required placeholder="Nhập 12 số định danh"
                               class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 font-mono text-slate-800">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Số điện thoại</label>
                        <input type="text" th:field="*{phone}" placeholder="Ví dụ: 0912345678"
                               class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 text-slate-800">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Địa chỉ Email</label>
                    <input type="email" th:field="*{email}" placeholder="name@company.com"
                           class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 text-slate-800">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Địa chỉ thường trú (Quê
                        quán)</label>
                    <input type="text" th:field="*{address}" placeholder="Xã, Huyện, Tỉnh/Thành phố..."
                           class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 text-slate-800">
                </div>

                <div class="pt-4 border-t border-slate-100 flex justify-end gap-3">
                    <a th:href="@{/tenants}"
                       class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition">
                        Hủy bỏ
                    </a>
                    <button type="submit"
                            class="px-5 py-2 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 transition shadow-sm">
                        Lưu thông tin
                    </button>
                </div>

            </form>
        </div>

    </div>
</main>
</body>
</html>
