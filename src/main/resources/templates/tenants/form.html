<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tenant.id == null} ? 'Thêm Người Thuê - Hệ thống Quản lý Phòng Trọ' : 'Cập nhật Người Thuê - Hệ thống Quản lý Phòng Trọ'"></title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 antialiased min-h-screen">

<!-- 1. Chèn Header lên đầu trang -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Khối chia khung layout dưới Header -->
<div class="flex min-h-[calc(100vh-64px)]">

    <!-- 2. Chèn Sidebar bên trái -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- 3. Vùng nội dung nhập liệu chính bên phải -->
    <main class="flex-1 p-6 md:p-8 bg-slate-50">
        <div class="max-w-2xl mx-auto">

            <!-- Nút quay lại tinh tế -->
            <div class="mb-4">
                <a th:href="@{/tenants}"
                   class="inline-flex items-center text-xs font-semibold text-slate-500 hover:text-blue-600 transition-colors">
                    <svg class="w-3.5 h-3.5 me-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                         xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Quay lại danh sách khách thuê
                </a>
            </div>

            <!-- Tiêu đề trang form (Thêm mới hoặc Cập nhật) -->
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-slate-800 tracking-tight"
                    th:text="${tenant.id == null} ? 'Thêm người thuê mới' : 'Cập nhật thông tin khách thuê'"></h2>
                <p class="text-sm text-slate-500 mt-1">Vui lòng điền đầy đủ và chính xác các thông tin định danh pháp lý
                    dưới đây.</p>
            </div>

            <!-- Khung chứa Form (Đồng bộ độ bo góc rounded-2xl và border/shadow với trang quản lý phòng) -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 md:p-8">
                <form th:action="@{/tenants/save}" th:object="${tenant}" method="post" class="space-y-5">

                    <!-- ID ẩn để cập nhật -->
                    <input type="hidden" th:field="*{id}">

                    <!-- Họ và Tên -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                            Họ và Tên <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" th:field="*{fullName}" required placeholder="Ví dụ: Nguyễn Văn A"
                               class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                    </div>

                    <!-- Số CCCD và Số điện thoại trên một dòng -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                                Số CCCD / CMND <span class="text-rose-500">*</span>
                            </label>
                            <input type="text" th:field="*{citizenId}" required placeholder="Nhập 12 số định danh"
                                   class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 font-mono text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                                Số điện thoại
                            </label>
                            <input type="text" th:field="*{phone}" placeholder="Ví dụ: 0912345678"
                                   class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                        </div>
                    </div>

                    <!-- Địa chỉ Email -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                            Địa chỉ Email
                        </label>
                        <input type="email" th:field="*{email}" placeholder="name@company.com"
                               class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                    </div>

                    <!-- Địa chỉ thường trú -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                            Địa chỉ thường trú (Quê quán)
                        </label>
                        <input type="text" th:field="*{address}" placeholder="Xã/Phường, Huyện/Quận, Tỉnh/Thành phố..."
                               class="w-full px-4 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition duration-150">
                    </div>

                    <!-- Cụm nút hành động dưới đáy form -->
                    <div class="pt-5 border-t border-slate-100 flex items-center justify-end gap-3">
                        <a th:href="@{/tenants}"
                           class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition duration-150">
                            Hủy bỏ
                        </a>
                        <button type="submit"
                                class="inline-flex items-center justify-center px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition duration-150 cursor-pointer shadow-sm shadow-blue-500/10">
                            Lưu thông tin
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </main>
</div>

</body>
</html>
