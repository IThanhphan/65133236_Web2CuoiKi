<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hệ thống Quản lý Phòng Trọ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 antialiased min-h-screen">

<div th:replace="~{fragments/header :: header}"></div>

<div class="flex min-h-[calc(100vh-64px)]">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="flex-1 p-6 md:p-8 bg-slate-50">

        <div class="mb-6">
            <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Dashboard</h2>
            <p class="text-sm text-slate-500 mt-1">Tổng quan tình hình kinh doanh khu trọ tháng hiện tại.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-200">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Tổng số phòng</h3>
                    <span class="p-2 bg-blue-50 text-blue-600 rounded-lg text-sm font-medium">Phòng</span>
                </div>
                <div class="text-3xl font-extrabold text-blue-600 mt-4">20</div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-200">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Đã thuê</h3>
                    <span class="p-2 bg-emerald-50 text-emerald-600 rounded-lg text-sm font-medium">Sử dụng</span>
                </div>
                <div class="text-3xl font-extrabold text-emerald-600 mt-4">15</div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-200">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Còn trống</h3>
                    <span class="p-2 bg-amber-50 text-amber-600 rounded-lg text-sm font-medium">Sẵn sàng</span>
                </div>
                <div class="text-3xl font-extrabold text-amber-500 mt-4">5</div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-200">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Hợp đồng hoạt động</h3>
                    <span class="p-2 bg-indigo-50 text-indigo-600 rounded-lg text-sm font-medium">Hiệu lực</span>
                </div>
                <div class="text-3xl font-extrabold text-indigo-600 mt-4">15</div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-200">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Doanh thu tháng</h3>
                    <span class="p-2 bg-violet-50 text-violet-600 rounded-lg text-sm font-medium">VND</span>
                </div>
                <div class="text-3xl font-extrabold text-violet-600 mt-4">30M</div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-200">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Hóa đơn chưa thanh
                        toán</h3>
                    <span class="p-2 bg-rose-50 text-rose-600 rounded-lg text-sm font-medium">Chờ thu</span>
                </div>
                <div class="text-3xl font-extrabold text-rose-600 mt-4">3</div>
            </div>

        </div>

    </main>
</div>

</body>
</html>
